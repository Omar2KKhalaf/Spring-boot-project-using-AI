<div class="login-wrapper bg-image" style="width: 100%;">
  <div class="login-container col-md-6">
    <div class="login-header d-flex justify-content-between align-items-center">
      <h1>{{'REGISTER'|translate}}</h1>
      <button class="btn btn-secondary btn-sm rounded-circle language-switch" 
          [style.right]="currentLanguage === 'en' ? '20px' : null" 
          [style.left]="currentLanguage === 'ar' ? '20px' : null" 
          (click)="switchLanguage()">
          {{ currentLanguage === 'en' ? 'ع' : 'EN' }}
          </button>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Input for Email -->
      <div class="form-group">
        <label>{{ 'EMAIL' | translate }}</label>
        <input type="email" formControlName="email" class="form-control" required>
        <div *ngIf="registerForm.get('email').hasError('invalidEmail')" class="error-message">
          {{ 'INVALID_EMAIL' | translate }}
        </div>
      </div>
      <!-- Input for Password -->
      <div class="form-group">
        <label>{{ 'PASSWORD' | translate }}</label>
        <input type="password" formControlName="password" class="form-control" required>
        <div *ngIf="registerForm.get('password').hasError('invalidPassword')" class="error-message">
          {{ 'INVALID_PASSWORD' | translate }}
        </div>
      </div>
      <!-- Additional fields as needed... -->
      <button type="submit" class="btn btn-primary">{{ 'REGISTER' | translate }}</button>
    </form>
    <p style="margin-top: 10px;">{{ 'ALREADY_HAVE_AN_ACCOUNT' | translate }}
      <a routerLink="/login">{{ 'LOGIN_NOW' | translate }}</a>
    </p>

  </div>
</div>
