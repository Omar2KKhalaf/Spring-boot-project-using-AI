<app-header></app-header>
<form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="container mt-3" style="background-image: url('/assets/images/login-background.jpg');">
  <div class="form-section mb-3">
    <h2>{{ 'TEAM_INFO' | translate }}</h2>
    
    <div class="form-group">
      <label>{{ 'TEAM_NAME' | translate }}</label>
      <input type="text" formControlName="teamName" class="form-control" placeholder="{{ 'ENTER_TEAM_NAME' | translate }}">
      <small *ngIf="registrationForm.get('teamName').hasError('required')" class="text-danger">
        Team Name is required
      </small>
    </div>
    
    <div class="form-group">
      <label>{{ 'SELECTED_CHALLENGE' | translate }}</label>
      <mat-select formControlName="selectedChallenge" class="form-control">
        <mat-option *ngFor="let challenge of challengeList" [value]="challenge">{{ challenge }}</mat-option>
      </mat-select>
      <small *ngIf="registrationForm.get('selectedChallenge').hasError('required')" class="text-danger">
        Please select a challenge
      </small>
    </div>
    
    <button type="button" class="btn btn-outline-secondary btn-lg rounded-pill" (click)="addTeamMember()" [disabled]="isMaxTeamSizeReached()">
      {{ 'ADD_TEAM_MEMBER' | translate }}
    </button>
  </div>

  <div class="form-section" formArrayName="teamMembers" *ngFor="let member of teamMembers().controls; let i = index">
    <div [formGroupName]="i" class="mb-3">
      <h2>{{ 'TEAM_MEMBER_INFO' | translate }} {{i + 1}}</h2>
      <div class="row mb-2">
        <div class="form-group col-md-4">
          <label>{{ 'TITLE' | translate }}</label>
          <input type="text" formControlName="title" class="form-control" placeholder="{{ 'ENTER_TITLE' | translate }}">
        </div>
        <div class="form-group col-md-4">
          <label>{{ 'NAME' | translate }}</label>
          <input type="text" formControlName="name" class="form-control" placeholder="{{ 'ENTER_NAME' | translate }}">
          <small *ngIf="registrationForm.get('teamMembers').get(i+'.name').hasError('required')" class="text-danger">
            Name is required
          </small>
        </div>
        <div class="form-group col-md-4">
          <label>{{ 'ID' | translate }}</label>
          <input type="text" formControlName="id" class="form-control" placeholder="{{ 'ENTER_ID' | translate }}">
        </div>
        <div class="form-group col-md-6">
          <label>{{ 'EMAIL' | translate }}</label>
          <input type="email" formControlName="email" class="form-control" placeholder="{{ 'ENTER_EMAIL' | translate }}">
        </div>
        <div class="form-group col-md-6">
          <label>{{ 'MOBILE' | translate }}</label>
          <input type="text" formControlName="mobile" class="form-control" placeholder="{{ 'ENTER_MOBILE' | translate }}">
        </div>
      </div>
      <button *ngIf="i!=0" type="button" class="btn btn-outline-danger btn-sm rounded-pill" (click)="removeTeamMember(i)">{{ 'REMOVE_TEAM_MEMBER' |
        translate
        }}</button>
    </div>
  </div>

  <button type="submit" class="btn btn-success rounded-pill">{{ 'REGISTER_HACKATHON' | translate }}</button>
</form>
<app-footer></app-footer>
